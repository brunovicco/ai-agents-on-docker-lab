# Keep pinned digests, actions, and locked Python dependencies current.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /
      - /integrations
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
    # The builder must match the hardened 3.13 runtime and requires-python, so a new Python
    # minor or major version is a deliberate change. Dependabot still updates digests.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    # Major versions, such as the MCP SDK 2.x, need a reviewed migration.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
