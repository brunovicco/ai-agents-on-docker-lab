# Keep pinned digests, actions, and locked Python dependencies current.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /
      - /integrations
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
    # main requires up-to-date branches, so bundle updates: one pull request per base image
    # for both Dockerfiles, instead of one per directory.
    groups:
      base-images:
        patterns: ["*"]
        group-by: dependency-name
    # The builder must match the hardened 3.13 runtime and requires-python, so a new Python
    # minor or major version is a deliberate change. Dependabot still updates digests.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The Docker Agent image in compose.yaml, pinned by version and digest.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "compose"
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # main requires up-to-date branches, so bundle the week's updates into one pull request.
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    # main requires up-to-date branches, so bundle the week's updates into one pull request.
    groups:
      python-dependencies:
        patterns: ["*"]
    # Major versions, such as the MCP SDK 2.x, need a reviewed migration.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
