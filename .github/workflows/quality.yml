name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Project quality gate
        run: uv run python scripts/quality_gate.py

      - name: Verify solar planner and negative control
        run: |
          bash lab/demo.sh local
          if echo '{"hours":[9,12]}' | PYTHONPATH=src python -m solar_dispatch.entrypoints.dispatch verify lab/forecast/day.json; then
            exit 1
          fi

      - name: Verify MCP tool over stdio
        run: uv run --frozen --extra mcp python integrations/check_mcp.py

      - name: Validate sandbox kit against the official v3 schema
        env:
          KIT_SPEC_COMMIT: d841decb96d9d676a3813ad46cd05583591cdcb3
        run: |
          git init --quiet "$RUNNER_TEMP/sandbox-kit-spec"
          git -C "$RUNNER_TEMP/sandbox-kit-spec" fetch --quiet --depth 1 \
            https://github.com/docker/sandbox-kit-spec "$KIT_SPEC_COMMIT"
          git -C "$RUNNER_TEMP/sandbox-kit-spec" checkout --quiet FETCH_HEAD
          uv run --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.3 \
            python scripts/validate_kit.py "$RUNNER_TEMP/sandbox-kit-spec"

      - name: Validate the Compose stack for the local-model planner
        run: docker compose config --quiet

      - name: Validate the Docker Agent planner against the official schema
        env:
          AGENT_SCHEMA_COMMIT: 286653cdb996035b1b160d98010ca039cebb29dc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/agent-schema.json" \
            "https://raw.githubusercontent.com/docker/docker-agent/$AGENT_SCHEMA_COMMIT/agent-schema.json"
          uv run --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.3 \
            python scripts/validate_agent.py "$RUNNER_TEMP/agent-schema.json"

      - name: Compose the kit onto the pinned Shell workload and verify its proposal
        run: |
          set -o pipefail
          workload=$(sed -n 's/^  - \(docker\.io\/sbx\/shell:[^ ]*\)$/\1/p' lab/sbxenv.yaml)
          test -n "$workload"
          # The kit's requires must name capabilities the pinned workload publishes.
          docker buildx imagetools inspect --raw "$workload" |
            uv run --no-project --with pyyaml==6.0.3 python -c '
          import json, sys, yaml
          index = json.load(sys.stdin)
          provides = json.loads(index["annotations"]["vnd.docker.sandbox.kit.descriptor"])["provides"]
          names = {entry.split("@", 1)[0] for entry in provides}
          kit = yaml.safe_load(open("lab/solar-kit/solar-kit.yaml"))
          missing = [need for need in kit.get("requires", []) if need.split()[0] not in names]
          sys.exit(f"The workload does not provide {missing}" if missing else None)
          '
          docker buildx build -f lab/solar-kit/solar-kit.yaml --load -t solar-kit:ci lab/solar-kit
          printf 'FROM %s\nCOPY --from=solar-kit:ci / /\n' "$workload" | docker build -t solar-shell-kit:ci -
          docker run --rm --read-only --network none --entrypoint solar-plan \
            -v "$PWD/lab/forecast:/forecast:ro" solar-shell-kit:ci |
            PYTHONPATH=src python3 -m solar_dispatch.entrypoints.dispatch verify lab/forecast/day.json
          # The planner ships in the kit; the repository source is not in the sandbox.
          if docker run --rm --entrypoint test solar-shell-kit:ci -e /lab-src; then
            exit 1
          fi

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DHI_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Log in to Docker Hardened Images
        if: env.DHI_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Fall back to the official runtime without DHI credentials
        if: env.DHI_USERNAME == ''
        run: |
          echo "::warning::DOCKERHUB_USERNAME is not set, so the images run on the Docker Official Python image instead of DHI"
          # Reuse the builder image, so Dependabot's digest updates apply to the fallback too.
          builder=$(sed -n 's/^FROM \(python:3\.13-slim@sha256:[0-9a-f]*\) AS builder$/\1/p' Dockerfile)
          test -n "$builder"
          echo "RUNTIME_ARG=--build-arg RUNTIME_IMAGE=$builder" >> "$GITHUB_ENV"

      - name: Build application image
        run: docker build ${RUNTIME_ARG:-} -t solar-dispatch:ci .

      - name: Run the image without network on a read-only filesystem and verify on the host
        run: |
          set -o pipefail
          docker run --rm --read-only --network none solar-dispatch:ci |
            PYTHONPATH=src python3 -m solar_dispatch.entrypoints.dispatch verify lab/forecast/day.json

      - name: Confirm the image runs as the unprivileged runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' solar-dispatch:ci)" = "65532"

      - name: Reject a suboptimal proposal inside the container
        run: |
          if echo '{"hours":[9,12]}' |
            docker run --rm -i --read-only --network none solar-dispatch:ci verify lab/forecast/day.json; then
            exit 1
          fi

      - name: Build MCP server image
        run: docker build ${RUNTIME_ARG:-} -f integrations/Dockerfile -t solar-forecast-mcp:ci .

      - name: Check the MCP servers inside the container over stdio
        run: uv run --frozen --extra mcp python integrations/check_mcp.py --image solar-forecast-mcp:ci

      - name: Check the forecast server over streamable HTTP on loopback
        run: |
          docker run -d --rm --name solar-forecast-mcp-http -p 127.0.0.1:8822:8000 --read-only \
            --cap-drop ALL --security-opt no-new-privileges solar-forecast-mcp:ci \
            --transport streamable-http --host 0.0.0.0 --port 8000
          trap 'docker rm -f solar-forecast-mcp-http >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8822/mcp || true)" != "000" ] && break
            sleep 0.25
          done
          uv run --frozen --extra mcp python integrations/check_mcp.py --url http://127.0.0.1:8822/mcp
          # A well-formed MCP request with a non-loopback Host must be refused (DNS rebinding).
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8822/mcp \
            -H 'Host: evil.example' -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"ping"}')
          test "$status" = "421"

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the application image for arm64 and verify its proposal under emulation
        run: |
          set -o pipefail
          docker buildx build ${RUNTIME_ARG:-} --platform linux/arm64 --load -t solar-dispatch:ci-arm64 .
          test "$(docker image inspect --format '{{.Architecture}}' solar-dispatch:ci-arm64)" = "arm64"
          docker run --rm --platform linux/arm64 --read-only --network none solar-dispatch:ci-arm64 |
            PYTHONPATH=src python3 -m solar_dispatch.entrypoints.dispatch verify lab/forecast/day.json

      - name: Build the MCP server image for arm64
        run: docker buildx build ${RUNTIME_ARG:-} --platform linux/arm64 -f integrations/Dockerfile .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, container]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges the workflow's OIDC token for a short-lived certificate.
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish application image with SBOM and provenance
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/brunovicco/solar-dispatch:main
            ghcr.io/brunovicco/solar-dispatch:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Solar EV charging planner CLI on a Docker Hardened Image

      - name: Publish MCP server image with SBOM and provenance
        id: mcp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: integrations/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/brunovicco/solar-forecast-mcp:main
            ghcr.io/brunovicco/solar-forecast-mcp:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Read-only forecast and decoy MCP servers for the Solar Dispatch Lab

      - name: Publish the sandbox kit
        id: kit
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: lab/solar-kit
          file: lab/solar-kit/solar-kit.yaml
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/brunovicco/solar-kit:main
            ghcr.io/brunovicco/solar-kit:sha-${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign the published images and kit by digest
        env:
          APP: ghcr.io/brunovicco/solar-dispatch@${{ steps.app.outputs.digest }}
          MCP: ghcr.io/brunovicco/solar-forecast-mcp@${{ steps.mcp.outputs.digest }}
          KIT: ghcr.io/brunovicco/solar-kit@${{ steps.kit.outputs.digest }}
        run: |
          for ref in "$APP" "$MCP" "$KIT"; do
            cosign sign --yes "$ref"
          done

      - name: Verify each signature against this workflow's identity
        env:
          APP: ghcr.io/brunovicco/solar-dispatch@${{ steps.app.outputs.digest }}
          MCP: ghcr.io/brunovicco/solar-forecast-mcp@${{ steps.mcp.outputs.digest }}
          KIT: ghcr.io/brunovicco/solar-kit@${{ steps.kit.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          # workflow_ref ends in @refs/heads/main, so a signature made on another branch or by
          # another workflow does not verify.
          for ref in "$APP" "$MCP" "$KIT"; do
            cosign verify "$ref" --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            echo "Verified $ref"
          done
